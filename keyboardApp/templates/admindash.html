<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="p-4 bg-light">
    <button
      type="button"
      id="logoutButton"
      class="btn btn-primary mb-4"
      onclick="window.location.href='/keyboardApp/'"
    >
      Logout
    </button>
    <h2>Admin Dashboard - Manage Items</h2>

    <form id="itemForm" class="mb-4" enctype="multipart/form-data">
      <input type="hidden" id="itemId" />
      <div class="mb-2">
        <input
          type="text"
          id="itemName"
          placeholder="Name"
          class="form-control"
          required
        />
      </div>
      <div class="mb-2">
        <input
          type="text"
          id="itemDescription"
          placeholder="Description"
          class="form-control"
        />
      </div>
      <div class="mb-2">
        <input
          type="text"
          id="itemColor"
          placeholder="Key Color"
          class="form-control"
        />
      </div>
      <div class="mb-2">
        <input
          type="text"
          id="itemBrand"
          placeholder="Brand"
          class="form-control"
        />
      </div>
      <div class="mb-2">
        <input
          type="number"
          id="itemPrice"
          placeholder="Price"
          class="form-control"
          step="0.01"
        />
      </div>
      <div class="mb-2">
        <input type="file" id="itemImage" class="form-control" />
        <img
          id="currentImagePreview"
          src=""
          width="100"
          class="mb-2"
          style="display: none"
        />
      </div>
      <button type="submit" class="btn btn-primary">Save Item</button>
    </form>

    <table class="table table-striped">
      <thead>
        <tr>
          <th>Preview</th>
          <th>Name</th>
          <th>Price</th>
          <th>Brand</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="itemTable"></tbody>
    </table>
    <script>
      const API_URL = "/keyboardApp/api/admin/items/";
      const logoutButton = document.getElementById("logoutButton");
      logoutButton.addEventListener("click", async function () {
        try {
          let logoutResp = await fetch(
            "http://127.0.0.1:8000/api/keyboardApp/auth/logout",
            { credentials: "same-origin" }
          );
          alert("log out successfully");
          window.location.href = "/keyboardApp/home";
        } catch (err) {
          console.log(err);
          alert("Failed to log out, Please try again");
        }
      });
      function getCSRFToken() {
        return document
          .querySelector('meta[name="csrf-token"]')
          .getAttribute("content");
      }

      function fetchItems() {
        fetch(API_URL)
          .then((res) => res.json())
          .then((items) => {
            const table = document.getElementById("itemTable");
            table.innerHTML = "";
            items.forEach((item) => {
              const row = `
          <tr>
            <td><img src="${item.item_image}" width="80" /></td>
            <td>${item.item_name}</td>
            <td>$${item.item_price}</td>
            <td>${item.item_brand}</td>
            <td>
              <button onclick="editItem(${item.item_id})" class="btn btn-sm btn-warning">Edit</button>
              <button onclick="deleteItem(${item.item_id})" class="btn btn-sm btn-danger">Delete</button>
            </td>
          </tr>`;
              table.innerHTML += row;
            });
          });
      }

      document
        .getElementById("itemForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const id = document.getElementById("itemId").value;
          const formData = new FormData();
          formData.append(
            "item_name",
            document.getElementById("itemName").value
          );
          formData.append(
            "item_description",
            document.getElementById("itemDescription").value
          );
          formData.append(
            "item_key_color",
            document.getElementById("itemColor").value
          );
          formData.append(
            "item_brand",
            document.getElementById("itemBrand").value
          );
          formData.append(
            "item_price",
            document.getElementById("itemPrice").value
          );
          const image = document.getElementById("itemImage").files[0];
          if (image) formData.append("item_image", image);

          // const newItem = {
          //   item_name: document.getElementById("itemName").value,
          //   item_description: document.getElementById("itemDescription").value,
          //   item_key_color: document.getElementById("itemColor").value,
          //   item_brand: document.getElementById("itemBrand").value,
          //   item_price: document.getElementById("itemPrice").value,
          //   item_image: document.getElementById("itemImage").files[0],
          // };
          // const formData = new FormData();
          // for (const key in newItem) {
          //   if (newItem[key] !== undefined && newItem[key] !== null) {
          //     formData.append(key, newItem[key]);
          //   }
          // }
          // if (id) {
          //   formData.append("item_id", id);
          // }

          const url = id ? `${API_URL}${id}/` : API_URL;
          const method = id ? "PUT" : "POST";

          fetch(url, {
            method: method,
            body: formData,
            headers: {
              "X-CSRFToken": getCSRFToken(),
            },
            credentials: "include",
          })
            .then((res) => {
              if (!res.ok) {
                return res.text().then((text) => {
                  throw new Error(text);
                });
              }
              return res.json();
            })
            .then(() => {
              this.reset();
              fetchItems();
            })
            .catch((err) => {
              console.error("Raw error:", err);
              alert("Error saving item: " + err.message);
            });
        });

      function editItem(id) {
        fetch(`${API_URL}${id}/`)
          .then((res) => res.json())
          .then((item) => {
            document.getElementById("itemId").value = item.item_id;
            document.getElementById("itemName").value = item.item_name;
            document.getElementById("itemDescription").value =
              item.item_description;
            document.getElementById("itemColor").value = item.item_key_color;
            document.getElementById("itemBrand").value = item.item_brand;
            document.getElementById("itemPrice").value = item.item_price;
            document.getElementById("currentImagePreview").style.display =
              "block";
            document.getElementById("currentImagePreview").src =
              item.item_image;
          });
      }

      function deleteItem(id) {
        if (confirm("Are you sure you want to delete this item?")) {
          fetch(`${API_URL}${id}/`, {
            method: "DELETE",
            headers: {
              "X-CSRFToken": getCSRFToken(),
            },
            credentials: "include",
          }).then(fetchItems);
        }
      }

      fetchItems();
    </script>

</html>
